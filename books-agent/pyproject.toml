[project]
name = "books-agent"
version = "0.1.0"
description = "Books agent service (FastAPI + Continuum) for the agent POC."
requires-python = ">=3.13"
dependencies = [
    "shyftlabs-continuum==2.1.0",
    "anthropic[bedrock]>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff==0.8.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
