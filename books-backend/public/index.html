<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books Agent POC</title>
    <style>
      :root {
        --bg: #f7f8f8;
        --panel: #fff;
        --fg: #172322;
        --muted: #5f716e;
        --line: #d9e2e0;
        --accent: #0f6f66;
        --warn: #9a5a07;
        --err: #b4232f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px 16px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
      }
      @media (max-width: 800px) {
        .wrap {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        grid-column: 1 / -1;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        min-width: 0;
      }
      label {
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-top: 8px;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      button {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.ghost {
        background: #fff;
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #log {
        height: 60vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        padding: 8px 10px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      .user {
        background: #e3f1ef;
        align-self: flex-end;
        max-width: 85%;
      }
      .assistant {
        background: #f1f3f3;
        max-width: 90%;
      }
      .step {
        font:
          12px/1.4 ui-monospace,
          Consolas,
          monospace;
        color: var(--muted);
      }
      .error {
        color: var(--err);
      }
      .confirm {
        border: 1px solid var(--warn);
        border-radius: 6px;
        padding: 10px;
        background: #fff8ec;
      }
      .confirm pre {
        font-size: 12px;
        white-space: pre-wrap;
        margin: 6px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .meta {
        font:
          12px ui-monospace,
          Consolas,
          monospace;
        color: var(--muted);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Books Agent POC — browser → backend relay → agent → backend GraphQL</h1>

      <div class="card">
        <div id="log" aria-live="polite"></div>
        <form id="chat" class="row">
          <input
            id="text"
            placeholder="e.g. Which sci-fi books do we have? / Change Dune's year to 1966 / Delete Clean Code"
            autocomplete="off"
            disabled
          />
          <button id="send" disabled>Send</button>
        </form>
      </div>

      <div class="card">
        <strong>Sign in</strong>
        <label for="user">Test user (passwords in src/db/seed-users.ts)</label>
        <select id="user">
          <option value="admin@books.local">admin@books.local — can delete</option>
          <option value="editor@books.local">editor@books.local — can edit</option>
          <option value="viewer@books.local">viewer@books.local — read only</option>
        </select>
        <label for="pw">Password</label>
        <input id="pw" type="password" />
        <div class="row">
          <button id="login">Sign in</button><button id="newconv" class="ghost" disabled>New chat</button>
        </div>
        <p class="meta" id="who">Not signed in</p>
        <p class="meta" id="conv"></p>
        <p class="meta">Last event seq: <span id="seq">0</span></p>
        <div class="row"><button id="resume" class="ghost" disabled>Replay from storage</button></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let token = null,
        conversationId = null,
        lastSeq = 0,
        assistantEl = null;

      function add(cls, text) {
        const el = document.createElement('div');
        el.className = cls;
        el.textContent = text;
        $('log').append(el);
        $('log').scrollTop = $('log').scrollHeight;
        return el;
      }

      async function api(path, body, method = 'POST') {
        const res = await fetch(path, {
          method,
          headers: { 'content-type': 'application/json', authorization: token },
          body: body ? JSON.stringify(body) : undefined,
        });
        return res;
      }

      // Reads a text/event-stream response with fetch (EventSource cannot send the authorization header).
      async function readStream(res) {
        if (!res.ok || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
          add('msg assistant error', `HTTP ${res.status}: ${await res.text()}`);
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const frame = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            handleFrame(frame);
          }
        }
      }

      function handleFrame(frame) {
        if (frame.startsWith(':')) return; // heartbeat
        let id = 0,
          type = 'message',
          data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('id: ')) id = Number(line.slice(4));
          else if (line.startsWith('event: ')) type = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (id) {
          lastSeq = Math.max(lastSeq, id);
          $('seq').textContent = lastSeq;
        }
        render(type, data ? JSON.parse(data) : {});
      }

      function render(type, d) {
        switch (type) {
          case 'turn_start':
            assistantEl = null;
            add('step', `▶ turn ${d.turnId} (${d.kind})`);
            break;
          case 'user_message':
            break; // already shown when sent (shown on replay below)
          case 'tool_call_start':
            add('step', `→ calling ${d.tool}${d.arguments ? ' ' + JSON.stringify(d.arguments) : ''}`);
            break;
          case 'tool_call_end':
            add(
              'step',
              `← ${d.tool}: ${typeof d.result === 'string' ? d.result : JSON.stringify(d.result)}`.slice(0, 300),
            );
            break;
          case 'tool_call_error':
            add('step error', `✕ ${d.tool}: ${d.error}`);
            break;
          case 'content_delta':
            if (!assistantEl) assistantEl = add('msg assistant', '');
            assistantEl.textContent += d.text;
            break;
          case 'assistant_message':
            if (!assistantEl) assistantEl = add('msg assistant', '');
            assistantEl.textContent = d.text;
            break;
          case 'confirm_required':
            renderConfirm(d);
            break;
          case 'confirm_received':
            add('step', `✓ you chose ${d.decision}`);
            break;
          case 'error':
            add('msg assistant error', d.message);
            break;
          case 'turn_end':
            add(
              'step',
              `■ turn ended: ${d.status}${d.checkpointVersion ? ' · checkpoint v' + d.checkpointVersion : ''}`,
            );
            break;
        }
      }

      function renderConfirm(a) {
        const box = document.createElement('div');
        box.className = 'confirm';
        box.innerHTML = `<strong></strong><pre></pre><div class="row"><button>Confirm</button><button class="ghost">Cancel</button></div>`;
        box.querySelector('strong').textContent = a.preview.summary;
        box.querySelector('pre').textContent =
          `before: ${JSON.stringify(a.preview.before, null, 1)}\nafter:  ${JSON.stringify(a.preview.after, null, 1)}\nexpires: ${a.expiresAt}`;
        const [ok, no] = box.querySelectorAll('button');
        const decide = async (decision) => {
          ok.disabled = no.disabled = true;
          await readStream(
            await api(`/api/agent/conversations/${conversationId}/confirm`, {
              turnId: 't_' + crypto.randomUUID(),
              actionId: a.actionId,
              decision,
            }),
          );
        };
        ok.onclick = () => decide('approve');
        no.onclick = () => decide('reject');
        $('log').append(box);
        $('log').scrollTop = $('log').scrollHeight;
      }

      $('login').onclick = async () => {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: $('user').value, password: $('pw').value }),
        });
        const body = await res.json();
        if (!res.ok) {
          $('who').textContent = body.error;
          return;
        }
        token = body.token;
        $('who').textContent = `Signed in as ${body.user.name} (${body.user.role})`;
        $('newconv').disabled = false;
        await newConversation();
      };

      async function newConversation() {
        const res = await api('/api/agent/conversations', {});
        const body = await res.json();
        if (!res.ok) {
          add('msg assistant error', JSON.stringify(body));
          return;
        }
        conversationId = body.conversationId;
        lastSeq = 0;
        $('conv').textContent = `conversation ${conversationId}`;
        $('log').innerHTML = '';
        $('text').disabled = $('send').disabled = $('resume').disabled = false;
        $('text').focus();
      }
      $('newconv').onclick = newConversation;

      $('chat').onsubmit = async (e) => {
        e.preventDefault();
        const text = $('text').value.trim();
        if (!text) return;
        $('text').value = '';
        $('send').disabled = true;
        add('msg user', text);
        // The client makes the turnId, so a network retry of the same POST is recognised and not run twice.
        await readStream(
          await api(`/api/agent/conversations/${conversationId}/messages`, {
            turnId: 't_' + crypto.randomUUID(),
            text,
          }),
        );
        $('send').disabled = false;
        $('text').focus();
      };

      $('resume').onclick = async () => {
        $('log').innerHTML = '';
        lastSeq = 0;
        const res = await api(`/api/agent/conversations/${conversationId}/events?after=0`, null, 'GET');
        const realRender = render;
        render = (type, d) => {
          if (type === 'user_message') add('msg user', d.text);
          realRender(type, d);
        };
        await readStream(res);
        render = realRender;
      };
    </script>
  </body>
</html>
