# pre-commit hooks for agent-poc (books-backend + books-agent).
#
# Setup once per clone:   python -m pre_commit install
# Run on everything:      python -m pre_commit run --all-files
# Update hook versions:   python -m pre_commit autoupdate
#
# Fixers (ruff --fix, ruff-format, prettier, whitespace) rewrite files and fail the commit;
# `git add` the changes and commit again.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# Generated Archify diagrams and receipts are build output, not source.
exclude: ^\.archify/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      # Config syntax
      - id: check-json
      - id: check-yaml
      - id: check-toml
      # Hygiene
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Secrets: API keys, tokens, passwords (including anything that leaks out of a .env file).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # books-agent: Python lint + format (settings in books-agent/pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ['--fix']
        files: ^books-agent/
      - id: ruff-format
        files: ^books-agent/

  # Local hooks: shell lint (needs `shellcheck` on PATH), books-backend format + typecheck
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: prettier
        name: prettier (books-backend)
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ['prettier@3.3.3']
        files: ^books-backend/.*\.(ts|js|json|html|md)$
        exclude: ^books-backend/package-lock\.json$
      - id: tsc
        name: tsc --noEmit (books-backend)
        language: system
        entry: npm --prefix books-backend run typecheck
        pass_filenames: false
        files: ^books-backend/.*\.ts$
